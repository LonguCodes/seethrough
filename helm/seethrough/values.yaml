# Default values for seethrough.
# This is a YAML-formatted file.

replicaCount: 1

image:
  api:
    repository: seethrough-api
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: seethrough-web
    tag: latest
    pullPolicy: IfNotPresent
  agent:
    repository: seethrough-agent
    tag: latest
    pullPolicy: IfNotPresent
  kubernetesAgent:
    repository: seethrough-kubernetes-agent
    tag: latest
    pullPolicy: IfNotPresent

service:
  api:
    type: ClusterIP
    port: 3000
    websocketPort: 3001
  web:
    type: LoadBalancer
    port: 80
    targetPort: 80

# Storage configuration
storage:
  postgres:
    enabled: true
    host: "postgres"
    port: 5432
    db: "monitoring"
    user: "root"
    password: "securepassword"
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""
  redis:
    enabled: true
    host: "redis"
    port: 6379
    persistence:
      enabled: true
      size: 2Gi
      storageClass: ""

config:
  api:
    url: "http://api:3000"
  websocket:
    url: "ws://api:3001"
  jwtSecret: ""
  logLevel: "log"
  reportInterval:
    agent: 5000
    kubernetesAgent: 5000

resources:
  api:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  web:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  agent:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi
  kubernetesAgent:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
