apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  labels:
    app: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: node-agent
          image: "{{ .Values.image.nodeAgent.repository }}:{{ .Values.image.nodeAgent.tag }}"
          imagePullPolicy: {{ .Values.image.nodeAgent.pullPolicy }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: API_URL
              value: {{ .Values.config.api.url | quote }}
            - name: MACHINE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: REPORT_INTERVAL
              value: {{ .Values.config.reportInterval.agent | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "seethrough.fullname" . }}-auth
                  key: jwt-secret
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          resources:
            {{- toYaml .Values.resources.agent | nindent 12 }}
          volumeMounts:
            - name: kubelet
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
      volumes:
        - name: kubelet
          hostPath:
            path: /var/lib/kubelet
            type: Directory
