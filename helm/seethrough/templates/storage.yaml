{{- if .Values.storage.postgres.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_USER
              value: {{ .Values.storage.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.storage.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.storage.postgres.db | quote }}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.storage.postgres.host }}
spec:
  ports:
    - port: 5432
  selector:
    app: postgres
{{ end }}
{{ if .Values.storage.valkey.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.storage.valkey.host }}
spec:
  ports:
    - port: 6379
  selector:
    app: valkey
{{- end }}
