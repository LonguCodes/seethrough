apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "seethrough.fullname" . }}-api
  labels:
    app: api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 3001
              name: websocket
          env:
            - name: DATABASE__HOST
              value: {{ .Values.storage.postgres.host | quote }}
            - name: DATABASE__DATABASE
              value: {{ .Values.storage.postgres.db | quote }}
            - name: DATABASE__USERNAME
              value: {{ .Values.storage.postgres.user | quote }}
            - name: DATABASE__PASSWORD
              value: {{ .Values.storage.postgres.password | quote }}
            - name: STORAGE_MODE
              value: {{ .Values.storage.mode | quote }}
            - name: VALKEY__HOST
              value: {{ .Values.storage.valkey.host | quote }}
            - name: VALKEY__PORT
              value: {{ .Values.storage.valkey.port | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "seethrough.fullname" . }}-auth
                  key: jwt-secret
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  type: {{ .Values.service.api.type }}
  ports:
    - port: 3000
      targetPort: 3000
      name: http
    - port: 3001
      targetPort: 3001
      name: websocket
  selector:
    app: api
