name: Docker Build and Push

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [node-agent, web, api, kubernetes-agent]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Turbo
        run: yarn global add turbo

      - name: Prune Monorepo
        run: turbo prune ${{ matrix.service }} --docker

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seethrough:${{ matrix.service }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seethrough:${{ matrix.service }}-${{ github.ref }}

  helm-publish:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package Helm Chart (Release)
        run: |
          mkdir -p ./helm-charts/charts
          CHART_DIR="./helm/seethrough"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${TAG_VERSION}/" "$CHART_DIR/Chart.yaml"
          helm package "$CHART_DIR" --destination ./helm-charts/charts

      - name: Generate Helm Repo Index
        run: |
          helm repo index ./helm-charts/charts --url https://longucodes.github.io/seethrough/charts

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-charts
          keep_files: true