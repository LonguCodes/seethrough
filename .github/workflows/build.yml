name: Docker Build and Push

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # Define a matrix of services you want to build
    strategy:
      matrix:
        service: [agent, web, api, kubernetes-agent] 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install Turbo
        run: yarn global add turbo

      - name: Prune Monorepo
        run: turbo prune ${{ matrix.service }} --docker

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/seethrough:${{ matrix.service }}-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/seethrough:${{ matrix.service }}-${{ github.sha }}