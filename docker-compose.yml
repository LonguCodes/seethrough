services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: 'template'
    ports:
      - 5432:5432
    volumes:
      - db_data:/vat/lib/postgresql/data
  smtp:
    image: rnwood/smtp4dev
    ports:
      - 15080:80
      - 2525:25
  valkey:
    image: valkey/valkey:8
    ports:
      - 6379:6379

volumes:
  db_data:
